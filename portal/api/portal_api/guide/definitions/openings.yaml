# The places to tap in the opening scene (spec §4.2; plan 5's design §6.1), in the order the list
# under the scene shows them. `picture` is the spot's id in the scene. A guided opening names the
# project part it belongs to, the screener answers it implies, and its "So you mean…" template;
# the rest say "coming soon" until their conversations are built. new_house and change_of_use were
# approved by the chair on 2026-11-06 (memos/2026-11-06-guided-builder-wording-for-approval.md).
