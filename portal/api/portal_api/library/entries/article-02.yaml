- id: lot_width
  kind: standard
  standards:
  - dimension:lot_dimensions.width
  overline: Why · how wide a lot is
  answer: A lot here is {width} wide.
  detail: Lot width is the length of the front lot line, or the distance between the side lot lines at the front setback, whichever is greater. A lot narrower than this can still be built on if it meets the setbacks.
  why: Lot sizes keep the pattern of each neighborhood.
  slots:
    width:
      standard: dimension:lot_dimensions.width
      part: range
  terms:
  - Lot Width
  cites:
  - 2.2.a.1
  - 2.2.d.2
  - 2.2.f.6
  version: 1
  status: draft
