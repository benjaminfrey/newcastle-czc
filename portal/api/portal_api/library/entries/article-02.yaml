open_questions:
- 'Frontage zone setback (D3, D4, D5, D6 and four special districts): the district pages give a number, and Article 9 defines the Frontage Zone as the Frontage plus an additional setback from the front facade. Does the number say how far the zone reaches behind the front of the building? No entry is written until you say what it measures.'
- 'Lot depth and lot area: every district page says n/a, so there is no entry, and the guide doesn''t ask them. Should a resident be told the Code sets none, or nothing at all?'
- 'Permitting Authority: the tables say "CEO" or "Planning Board", and the entry fills them in as written ("the CEO reviews your project"). Should it spell out "Code Enforcement Officer"?'
- Ranges read "at least 20 ft", "at most 2 stories" or "between 0 and 5 ft". These three patterns are new words, for your approval with the entries.
- 'A zero limit reads as written: D6''s front setback "at most 0 ft" (the building sits on the line), and SD-Campus''s "at least 0 ft" (no minimum). Should these say "on the lot line" and "no minimum" instead? That would be three more approved patterns.'
