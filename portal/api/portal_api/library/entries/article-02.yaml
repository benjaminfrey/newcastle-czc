  - dimension:building_placement.side_setback
  overline: Why · how far from the sides
  answer: Your building sits {side} from each side lot line.
  detail: Measure from each side lot line to the closest outside wall. Where your lot meets a lot in another district, the side setback of the less strict district may be used along that line.
  why: Side setbacks keep light, air and room between neighbors.
