- id: total_stories
  kind: standard
  standards:
  - building:total_stories
  overline: Why · how tall the building is
  answer: The building has {stories}.
  detail: Only floors with full-height outside walls count. Space inside a pitched roof usually isn't a story.
  why: Height limits keep buildings in scale with their street.
  slots:
    stories:
      standard: building:total_stories
      part: range
  terms:
  - Story
  cites:
  - 5.7.c.1
  - 5.7.c.3
  - 5.7.c.4
  - 5.7.c.5
  - 5.7.c.6
  picture: stories
  picture_alt: A house cut open to show its floors. The first and second floors have full-height walls and count as stories. A floor inside the roof counts only if the roof meets its wall more than 3 feet above the floor. A basement counts if 5 feet or more of its wall shows above the ground along the front.
  version: 1
  status: draft
