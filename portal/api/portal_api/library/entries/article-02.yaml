  overline: Why · how tall the upper floors are
  answer: Each upper floor is {height} tall.
  detail: Measure from the surface of each floor to the surface of the floor above. For the top floor, measure to the top of the wall.
  why: Floor heights help new buildings match the scale of the street.
  slots:
