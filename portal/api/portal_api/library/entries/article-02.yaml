  kind: standard
  standards:
  - building:first_floor_height
  overline: Why · how tall the first floor is
  answer: The first floor is {height} tall.
  detail: Measure from the surface of the first floor to the surface of the floor above. With no floor above, measure to the top of the wall.
  why: Floor heights help new buildings match the scale of the street.
  slots:
    height:
      standard: building:first_floor_height
      part: range
  cites:
  - 5.7.c.2
  version: 1
  status: draft
