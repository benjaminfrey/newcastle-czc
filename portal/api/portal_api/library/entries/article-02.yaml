- id: accessory_front_setback
  kind: standard
  standards:
  - dimension:accessory_building_placement.primary_front_setback
  overline: Why · where a garage or shed sits
  answer: An accessory building sits {front} from the front lot line.
  detail: An accessory building goes with the main building on your lot, like a garage, barn or shed. Small structures like garden sheds keep these setbacks too.
  why: Smaller buildings sit back from the street, so the main building leads.
