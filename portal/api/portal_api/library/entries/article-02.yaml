entries:
- id: front_setback
  kind: standard
  standards:
  - dimension:primary_building_placement.primary_front_setback
  - dimension:building_placement.primary_front_setback
  overline: Why · how far from the front
  answer: Your building sits {front} from the front lot line.
  detail: Measure from the front lot line to the closest outside wall, straight out from the line. On a corner lot, the front is the line along the busier road.
  why: A front setback keeps buildings in line along the street, so each street keeps its character.
  slots:
    front:
      standard:
      - dimension:primary_building_placement.primary_front_setback
      - dimension:building_placement.primary_front_setback
      part: range
  terms:
  - Setback
  - Lot Line
  cites:
  - 2.3.a.1
  - 2.3.c.1
  - 2.3.c.3
  - 2.3.c.8
  picture: setbacks
  picture_alt: 'A house on its lot, with an arrow from each lot line to the nearest part of the house: the front, the nearest side, the other side and the rear. Each setback is measured along its arrow.'
  version: 1
  status: draft
- id: secondary_front_setback
  kind: standard
  standards:
  - dimension:primary_building_placement.secondary_front_setback
  - dimension:building_placement.secondary_front_setback
  overline: Why · the second road on a corner lot
  answer: Along the second road, your building sits {secondary} from the lot line.
  detail: This applies only to a corner lot. The second road is the one that isn't your front. Measure to the closest outside wall.
  why: A corner building faces both streets, so it keeps in line along both.
  slots:
