# Plain groups for finding a use. Every use-table use appears in exactly one group,
# with its uses.json definition key (shown to applicants word for word) and a short
# plain example, drafted from that definition. Examples are drafts until the chair
# approves them.
- key: home
  plain: "A home"
  uses:
    - use_key: residence
      definition_key: "RESIDENCE"
      example: "A house, apartment or room to live in, whether you live there yourself or rent it out."
      status: approved
      approved_by: "Ben Frey, Planning Board chair"
      approved_on: "2026-10-20"
    - use_key: tourist_rental
      definition_key: "TOURIST RENTAL"
      example: "Renting out a home, or part of one, for stays shorter than 30 days."
      status: approved
      approved_by: "Ben Frey, Planning Board chair"
      approved_on: "2026-10-20"
    - use_key: bed_breakfast
      definition_key: "BED & BREAKFAST"
      example: "Guest rooms for overnight stays in a home where the owner lives."
      status: approved
      approved_by: "Ben Frey, Planning Board chair"
      approved_on: "2026-10-20"
    - use_key: rooming_house
      definition_key: "ROOMING HOUSE"
      example: "A building where unrelated people rent rooms and share kitchens or bathrooms."
      status: approved
      approved_by: "Ben Frey, Planning Board chair"
      approved_on: "2026-10-20"
    - use_key: dormitory
      definition_key: "DORMITORY"
      example: "Housing run by a school or college for its students or staff."
      status: approved
      approved_by: "Ben Frey, Planning Board chair"
      approved_on: "2026-10-20"
    - use_key: mobile_home_park
