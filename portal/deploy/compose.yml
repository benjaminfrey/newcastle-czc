name: portal
services:
  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: portal
    volumes: [db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal"]
      interval: 5s
      retries: 20
  api:
    build: ../api
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      PORTAL_DATABASE_URL: postgresql+psycopg://portal:${POSTGRES_PASSWORD}@db:5432/portal
      PORTAL_PUBLIC_BASE_URL: https://${PORTAL_HOST:?set in .env}
      PORTAL_SMTP_HOST: ${SMTP_HOST:?set in .env}
      PORTAL_SMTP_PORT: ${SMTP_PORT:-587}
      PORTAL_SMTP_FROM: ${SMTP_FROM:?set in .env}
  web:
    build: ../web
    restart: unless-stopped
    depends_on: [api]
    # PORTAL_BIND=127.0.0.1 keeps a trial run off the network; empty means every interface.
    ports: ["${PORTAL_BIND:-0.0.0.0}:80:80", "${PORTAL_BIND:-0.0.0.0}:443:443"]
    environment:
      PORTAL_HOST: ${PORTAL_HOST}
      PORTAL_TLS: ${PORTAL_TLS:-}
    volumes:
      # A directory, not the single file: a file mount pins the old inode when an
      # update replaces the file (rsync, git checkout), and Caddy never sees the change.
      - ./caddy:/etc/caddy:ro
      - caddy-data:/data
volumes:
  db:
  caddy-data:
