name: portal
services:
  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: portal
    volumes: [db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal"]
      interval: 5s
      retries: 20
  api:
    build: ../api
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      PORTAL_DATABASE_URL: postgresql+psycopg://portal:${POSTGRES_PASSWORD}@db:5432/portal
      PORTAL_PUBLIC_BASE_URL: https://${PORTAL_HOST:?set in .env}
      PORTAL_SMTP_HOST: ${SMTP_HOST:?set in .env}
      PORTAL_SMTP_PORT: ${SMTP_PORT:-587}
      PORTAL_SMTP_FROM: ${SMTP_FROM:?set in .env}
      PORTAL_S3_ENDPOINT: ${S3_ENDPOINT:-http://store:9000}
      PORTAL_S3_ACCESS_KEY: ${STORE_ACCESS_KEY:?set in .env}
      PORTAL_S3_SECRET_KEY: ${STORE_SECRET_KEY:?set in .env}
      PORTAL_CLAMD_HOST: clamav
  # Uploads: an S3-compatible store and ClamAV, on the internal network only (no ports).
  # On a managed platform, point S3_ENDPOINT at S3 or R2 and drop the store service.
  store:
    image: rustfs/rustfs:1.0.3
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${STORE_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${STORE_SECRET_KEY}
      RUSTFS_CONSOLE_ENABLE: "false"
    volumes: [uploads:/data]
  clamav:
    image: clamav/clamav:1.5.4-debian
    restart: unless-stopped
    # Room for a 25 MB upload plus framing (clamd's default stream limit is exactly 25 MB).
    entrypoint: ["/bin/sh", "-c", "echo 'StreamMaxLength 30M' >> /etc/clamav/clamd.conf; exec /init"]
    volumes: [clamav:/var/lib/clamav]
  web:
    build: ../web
    restart: unless-stopped
    depends_on: [api]
    # PORTAL_BIND=127.0.0.1 keeps a trial run off the network; empty means every interface.
    ports: ["${PORTAL_BIND:-0.0.0.0}:80:80", "${PORTAL_BIND:-0.0.0.0}:443:443"]
    environment:
      PORTAL_HOST: ${PORTAL_HOST}
      PORTAL_TLS: ${PORTAL_TLS:-}
    volumes:
      # A directory, not the single file: a file mount pins the old inode when an
      # update replaces the file (rsync, git checkout), and Caddy never sees the change.
      - ./caddy:/etc/caddy:ro
      - caddy-data:/data
volumes:
  db:
  caddy-data:
  uploads:
  clamav:
