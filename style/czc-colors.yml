    text: "#FFFFFF"
  SD_RuralHighway:
    name: "Rural Highway"
    hex:  "#7A6536"               # verify | olive-brown
    text: "#FFFFFF"
  SD_Campus:
    name: "Campus"
    hex:  "#69C2D6"               # verify | light sky blue
    text: "#333333"
  SD_Marine:
    name: "Marine"
