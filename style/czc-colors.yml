# Newcastle CZC color palette
# Canonical source for all colors used in draft renderings.
# Values are working estimates from visual inspection of the baseline PDF.
# Items marked "verify" should be confirmed by pixel sampling before v0.1 release.
#
# Used by:
#   - style/czc-template.typ (Typst template imports this via YAML)
#   - build scripts (pass selected colors as Typst inputs)

system:
  article_blue:       "#2E96CC"   # verify | Article display, section headings, divider lines, wordmark
  section_blue_dark:  "#2079B0"   # verify | Subsection headings, deep accents
  body_dark:          "#333333"   # body text
  footer_gray:        "#666666"   # footer date and "|" separators
  header_gray:        "#777777"   # header band topic name (small caps)
  table_tint:         "#E8E8E8"   # standard table header row background
  rule_gray:          "#B0B0B0"   # subtle horizontal rules in headers/footers
  page_bg:            "#FFFFFF"

districts:
  D1:
    name: "Rural"
    hex:  "#B5C58F"               # verify | olive / sage green
    text: "#333333"               # text color over this background
  D2:
    name: "Neighborhood Residential"
    hex:  "#F5E58A"               # verify | pale yellow
    text: "#333333"
  D3:
    name: "Neighborhood Business"
    hex:  "#C9A87C"               # verify | tan / light brown
    text: "#333333"
  D4:
    name: "Village Residential"
    hex:  "#F5D540"               # verify | saturated yellow
    text: "#333333"
  D5:
    name: "Village Business"
    hex:  "#C0A4D2"               # verify | light lavender purple
    text: "#333333"
  D6:
    name: "Town Center"
    hex:  "#5C2D74"               # verify | deep purple
    text: "#FFFFFF"

