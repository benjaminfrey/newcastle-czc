# Newcastle CZC color palette — all values MEASURED from the baseline PDF.
#
# Method: pymupdf text-span extraction + pixel sampling of rendered pages.
# See style/style-analysis.md for methodology and per-element sources.
#
# Used by:
#   - style/czc-template.typ (mirror of these values; keep in sync)
#   - build scripts (pass selected colors as Typst inputs)

system:
  article_blue:       "#367AAC"   # measured | Article displays, section headings, dividers, wordmark
  body_dark:          "#231F20"   # measured | body text (near-black warm gray)
  subsection_gray:    "#7C766F"   # measured | subsection markers, header band, district descriptors
  tab_gray:           "#BFBFBF"   # measured | article tab background fill (uniform across districts)
  black:              "#000000"   # measured | appears on some body spans (treat as visually equiv to body_dark)
  rule_gray:          "#231F20"   # measured | thin table rules (≈ #231F20 at low opacity, but rendered as full color thin)
  page_bg:            "#FFFFFF"

districts:
  D1:
    name: "Rural"
    hex:  "#CDE3CC"               # measured | pale mint green
    text: "#231F20"               # dark text on light background
  D2:
    name: "Neighborhood Residential"
    hex:  "#F3F2AE"               # measured | pale yellow
    text: "#231F20"
  D3:
    name: "Neighborhood Business"
    hex:  "#B4A27A"               # measured | tan / khaki
    text: "#231F20"
  D4:
    name: "Village Residential"
    hex:  "#EDE832"               # measured | bright lemon yellow
    text: "#231F20"
  D5:
    name: "Village Business"
    hex:  "#BBACD4"               # measured | lavender
    text: "#231F20"
  D6:
    name: "Town Center"
    hex:  "#502971"               # measured | deep eggplant purple
    text: "#FFFFFF"               # light text on dark background

special_districts:
  SD_Historic:
    name: "Historic"
    hex:  "#108C89"               # measured | dark teal
    text: "#FFFFFF"
  SD_Conservation:
    name: "Conservation"
    hex:  "#3CAC48"               # measured | medium green
    text: "#FFFFFF"
  SD_HighwayCommercial:
    name: "Highway Commercial"
    hex:  "#F2AB57"               # measured | orange
    text: "#231F20"
  SD_RuralHighway:
    name: "Rural Highway"
    hex:  "#716C53"               # measured | warm olive-brown
    text: "#FFFFFF"
  SD_Campus:
    name: "Campus"
    hex:  "#7ED0EE"               # measured | light sky blue
    text: "#231F20"
  SD_Marine:
    name: "Marine"
    hex:  "#1C66B0"               # measured | strong nautical blue
    text: "#FFFFFF"
  SD_Fabrication:
    name: "Fabrication"
    hex:  "#A7A9AB"               # measured | cool medium gray
    text: "#231F20"
  SD_Civic:
    name: "Civic"
    hex:  "#7C766F"               # proposed | no measurable color in baseline; uses subsection_gray
    text: "#FFFFFF"

